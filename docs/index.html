Date", "type": "date", "comment": "Date of the aggregation interval for the metrics.", "nullRatio": 0.0, "distinct": 151, "allNull": false, "constant": false, "pii": false, "piiLabels": []}, {"name": "nOffered", "type": "bigint", "comment": "Number of interactions routed to the queue during the interval.", "nullRatio": 0.0, "distinct": 217, "allNull": false, "constant": false, "pii": false, "piiLabels": []}, {"name": "nAnswered", "type": "bigint", "comment": "Number of interactions that were connected to an agent during the interval.", "nullRatio": 0.0, "distinct": 220, "allNull": false, "constant": false, "pii": false, "piiLabels": []}, {"name": "nAbandoned", "type": "bigint", "comment": "Number of interactions where the customer disconnected while waiting during the interval.", "nullRatio": 0.0, "distinct": 123, "allNull": false, "constant": false, "pii": false, "piiLabels": []}, {"name": "nTransferred", "type": "bigint", "comment": "Number of interactions that were moved to another queue or agent after being answered during the interval.", "nullRatio": 0.0, "distinct": 63, "allNull": false, "constant": false, "pii": false, "piiLabels": []}, {"name": "tAnswered", "type": "bigint", "comment": "Wait time in milliseconds before the customer was connected to an agent.", "nullRatio": 0.0, "distinct": 236, "allNull": false, "constant": false, "pii": false, "piiLabels": []}, {"name": "tAbandon", "type": "bigint", "comment": "Wait time in milliseconds before the customer disconnected without being answered.", "nullRatio": 0.0, "distinct": 228, "allNull": false, "constant": false, "pii": false, "piiLabels": []}, {"name": "tHandle", "type": "bigint", "comment": "Total time in milliseconds that an agent was occupied by the interaction (including talk, hold, and after\u2011call work).", "nullRatio": 0.0, "distinct": 244, "allNull": false, "constant": false, "pii": false, "piiLabels": []}, {"name": "oServiceLevel", "type": "double", "comment": "Proportion (0\u20111) of interactions answered within the configured service\u2011level threshold.", "nullRatio": 0.0, "distinct": 247, "allNull": false, "constant": false, "pii": false, "piiLabels": []}], "piiCount": 0, "deadCount": 0, "provenance": {"system": "genesys_cloud", "passages": ["genesys_cloud: Queue aggregate metrics", "genesys_cloud: Duration metrics", "genesys_cloud: Conversation attributes", "genesys_cloud: Metric naming convention"]}}, {"schema": "silver", "name": "apolices_curated", "key": "silver.apolices_curated", "type": "MANAGED", "owner": "dudubrxd18@gmail.com", "comment": "Curated view of active insurance policies, one row per policy with premium, coverage, dates and status.", "rows": 417, "sizeBytes": 9082, "numFiles": 1, "fragmented": false, "lastRead": "2026-09-09T14:19:12+00:00", "orphan": false, "writable": true, "columns": [{"name": "id_apolice", "type": "bigint", "comment": "Unique identifier of the policy record.", "nullRatio": 0.0, "distinct": 435, "allNull": false, "constant": false, "pii": false, "piiLabels": []}, {"name": "id_cliente", "type": "bigint", "comment": "Foreign key linking the policy to the customer registry record.", "nullRatio": 0.0, "distinct": 298, "allNull": false, "constant": false, "pii": false, "piiLabels": []}, {"name": "tipo_seguro", "type": "string", "comment": "Type of insurance, taking one of the values auto, residencial, vida, or viagem.", "nullRatio": 0.0, "distinct": 4, "allNull": false, "constant": false, "pii": false, "piiLabels": []}, {"name": "valor_premio", "type": "double", "comment": "Annualised premium amount in Brazilian reais.", "nullRatio": 0.0, "distinct": 397, "allNull": false, "constant": false, "pii": false, "piiLabels": []}, {"name": "valor_cobertura", "type": "double", "comment": "Maximum payout under the policy in Brazilian reais.", "nullRatio": 0.0, "distinct": 454, "allNull": false, "constant": false, "pii": false, "piiLabels": []}, {"name": "data_inicio", "type": "date", "comment": "Start date of the coverage period.", "nullRatio": 0.0, "distinct": 367, "allNull": false, "constant": false, "pii": false, "piiLabels": []}, {"name": "data_fim", "type": "date", "comment": "End date of the coverage period (typically one year after start).", "nullRatio": 0.0, "distinct": 351, "allNull": false, "constant": false, "pii": false, "piiLabels": []}, {"name": "status", "type": "string", "comment": "Policy status; in this curated view it is always ativa.", "nullRatio": 0.0, "distinct": 1, "allNull": false, "constant": true, "pii": false, "piiLabels": []}], "piiCount": 0, "deadCount": 1, "provenance": {"system": "seguracore", "passages": ["seguracore: Policy records", "seguracore: Claim records", "seguracore: Derived layers", "seguracore: Customer registry"]}}, {"schema": "staging", "name": "cad_gen_2021", "key": "staging.cad_gen_2021", "type": "MANAGED", "owner": "dudubrxd18@gmail.com", "comment": "Legacy CRM export table containing personal data fields and an estimated monthly premium.", "rows": 300, "sizeBytes": 18993, "numFiles": 2, "fragmented": true, "lastRead": "2026-09-09T14:19:10+00:00", "orphan": false, "writable": true, "columns": [{"name": "id", "type": "bigint", "comment": "Surrogate primary key identifier for each row.", "nullRatio": 0.0, "distinct": 296, "allNull": false, "constant": false, "pii": false, "piiLabels": []}, {"name": "f_01", "type": "string", "comment": "Full name of the registered person.", "nullRatio": 0.0, "distinct": 291, "allNull": false, "constant": false, "pii": true, "piiLabels": ["person_name (model)"]}, {"name": "f_02", "type": "string", "comment": "CPF (Brazilian individual taxpayer registration) formatted as a string.", "nullRatio": 0.0, "distinct": 318, "allNull": false, "constant": false, "pii": true, "piiLabels": ["national_id_verified", "national_id (model)"]}, {"name": "f_03", "type": "string", "comment": "Primary email address of the person.", "nullRatio": 0.0, "distinct": 307, "allNull": false, "constant": false, "pii": true, "piiLabels": ["e <script id="docs" type="application/json">[{"id": "genesys_cloud", "title": "Genesys Cloud \u2014 integration notes", "html": "<h1>Genesys Cloud \u2014 integration notes<\/h1>\n<blockquote>These are integration notes compiled for this project, not a Genesys document.<\/blockquote>\n<blockquote>They cover the fields this pipeline actually extracts. The authoritative reference<\/blockquote>\n<blockquote>is the Genesys Cloud Developer Center, and anything below should be verified<\/blockquote>\n<blockquote>against it before being relied on:<\/blockquote>\n<blockquote><a href=\"https://developer.genesys.cloud/analyticsdatamanagement/analytics/metrics\" target=\"_blank\" rel=\"noopener\">https://developer.genesys.cloud/analyticsdatamanagement/analytics/metrics<\/a><\/blockquote>\n<blockquote><\/blockquote>\n<blockquote>They are stored as a file rather than fetched from a URL on purpose: this pins the<\/blockquote>\n<blockquote>version the descriptions were generated against, so a description can be traced to<\/blockquote>\n<blockquote>the text that produced it.<\/blockquote>\n<h2>Metric naming convention<\/h2>\n<p>Analytics field names encode their own type in the first character, and this is the most important thing to know before reading any of them.<\/p>\n<ul>\n<li><code>n<\/code> prefix: a counter. <code>nOffered<\/code> is a number of interactions, not a null count.<\/li>\n<li><code>t<\/code> prefix: a timer. <strong>Every t-prefixed duration is in milliseconds.<\/strong><\/li>\n<li><code>o<\/code> prefix: an observation or ratio rather than a count or a duration.<\/li>\n<\/ul>\n<p>The millisecond unit is the single most expensive assumption to get wrong here. Treating <code>tTalk<\/code> as seconds and dividing by 60 produces an average handle time that looks entirely plausible and is off by a factor of a thousand. Nothing in the data signals the unit; the values are bare integers.<\/p>\n<h2>Conversation and participant identifiers<\/h2>\n<p>A conversation is one interaction with the contact centre and is identified by <code>conversationId<\/code>. A conversation contains one or more participants, identified by <code>participantId<\/code> -- the customer is a participant, each agent is a participant, and so are automated legs such as IVR. Each participant has one or more sessions, identified by <code>sessionId<\/code>, one per communication channel used.<\/p>\n<p>The practical consequence: a table at session grain has more rows than there are conversations, and counting rows to count interactions overstates volume. Aggregate on <code>conversationId<\/code> when the question is about interactions.<\/p>\n<h2>Conversation attributes<\/h2>\n<p><code>mediaType<\/code> is the channel: <code>voice<\/code>, <code>chat<\/code>, <code>email<\/code> or <code>callback<\/code>.<\/p>\n<p><code>direction<\/code> is <code>inbound<\/code> or <code>outbound<\/code> from the contact centre&#x27;s perspective.<\/p>\n<p><code>purpose<\/code> describes the role a participant played in the conversation: <code>customer<\/code> is the external party, <code>agent<\/code> is a human handling it, <code>acd<\/code> is the routing engine, and <code>ivr<\/code> is the automated menu. Filtering to <code>purpose = &#x27;agent&#x27;<\/code> is how you get handled interactions rather than every leg of the routing.<\/p>\n<p><code>queueId<\/code> is the identifier of the queue the interaction was routed through. <code>queueName<\/code> is its display label and is editable by administrators, so it changes over time while the id does not. Join on the id, display the name.<\/p>\n<p><code>wrapUpCode<\/code> is the disposition the agent selected when closing the interaction. The available codes are configured per organisation, so the value set is specific to the deployment and carries no meaning outside it.<\/p>\n<h2>Duration metrics<\/h2>\n<p>All values are in milliseconds.<\/p>\n<p><code>tAnswered<\/code> is how long the interaction waited before being connected to an agent. It measures the customer&#x27;s wait, not the agent&#x27;s work.<\/p>\n<p><code>tTalk<\/code> is time spent in conversation with the customer.<\/p>\n<p><code>tHeld<\/code> is time the customer spent on hold during the interaction.<\/p>\n<p><code>tAcw<\/code> is after-call work: time the agent spent completing the interaction after the customer disconnected. It is agent-occupied time that does not appear in <code>tTalk<\/code>, and excluding it understates agent workload.<\/p>\n<p><code>tHandle<\/code> is the total time an agent was occupied by the interaction. It is the composite measure and overlaps with the components above, so summing <code>tTalk<\/code>, <code>tHeld<\/code>, <code>tAcw<\/code> and <code>tHandle<\/code> together double-counts.<\/p>\n<p><code>tAbandon<\/code> is how long an interaction waited before the customer disconnected without being connected to an agent.<\/p>\n<h2>Queue aggregate metrics<\/h2>\n<p><code>nOffered<\/code> is the number of interactions routed to the queue. <code>nAnswered<\/code> is the number connected to an agent. <code>nAbandoned<\/code> is the number where the customer disconnected while waiting. <code>nTransferred<\/code> is the number moved to another queue or agent after being answered, so a transferred interaction was already counted in <code>nAnswered<\/code>.<\/p>\n<p><code>oServiceLevel<\/code> is the proportion of interactions answered within the configured service level threshold, expressed as a ratio between 0 and 1, not a percentage. Charting it without multiplying by 100 produces a service level graph that appears to sit near zero.<\/p>\n<h2>Personal data<\/h2>\n<p>Conversation records relate to identifiable individuals. <code>conversationId<\/code>, <code>participantId<\/code> and <code>sessionId<\/code> are pseudonymous identifiers for a person&#x27;s interaction and are personal data under GDPR even though they contain no name. Voice and chat transcript content, where extracted, is personal data outright.<\/p>"}, {"id": "legacy_crm", "title": "CadGen legacy CRM \u2014 export field reference", "html": "<h1>CadGen legacy CRM \u2014 export field reference<\/h1>\n<p>The CadGen CRM was retired in 2021. Its final export lands in the <code>staging<\/code> schema and is kept for regulatory retention. The export writes positional field names rather than semantic ones, so this reference is the only thing that says what the columns contain. Nothing in the data itself carries that meaning.<\/p>\n<h2>Positional field mapping<\/h2>\n<p>The extract emits fields in fixed order with generated names. The mapping has not changed since the 2018 format revision.<\/p>\n<table><tbody>\n<tr><th>Field<\/th><th>Contents<\/th><\/tr>\n<tr><td><code>f_01<\/code><\/td><td>Full name of the registered person<\/td><\/tr>\n<tr><td><code>f_02<\/code><\/td><td>CPF, Brazilian individual taxpayer registration, formatted<\/td><\/tr>\n<tr><td><code>f_03<\/code><\/td><td>Primary email address<\/td><\/tr>\n<tr><td><code>f_04<\/code><\/td><td>Mobile telephone number, digits only<\/td><\/tr>\n<tr><td><code>f_05<\/code><\/td><td>Date of birth, ISO 8601 text, not a date type<\/td><\/tr>\n<tr><td><code>f_06<\/code><\/td><td>City of residence<\/td><\/tr>\n<tr><td><code>vl_x<\/code><\/td><td>Estimated monthly premium at time of export, in reais<\/td><\/tr>\n<\/tbody><\/table>\n<p>Every field from <code>f_01<\/code> to <code>f_06<\/code> carries personal data about an identified person and is in scope for LGPD and GDPR subject-access requests. <code>f_02<\/code> and <code>f_05<\/code> are the direct identifiers; <code>f_06<\/code> is a location attribute, not a name, despite many Brazilian city names being indistinguishable from family surnames.<\/p>\n<h2>Retention and access<\/h2>\n<p>The export is retained for regulatory purposes and has no active consumer. It is not part of any reporting pipeline and no scheduled job reads it. Any read against it should be treated as ad hoc access to personal data and logged accordingly.<\/p>\n<h2>Backup extracts<\/h2>\n<p>Manual backup extracts taken during the migration carry the <code>import_backup_<\/code> name prefix. They duplicate a subset of the registry and were never cleaned up after the migration completed. They hold the same personal data as the main export and carry the same obligations, with no retention justification of their own.<\/p>"}, {"id": "seguracore", "title": "SeguraCore Policy Administration \u2014 integration notes", "html": "<h1>SeguraCore Policy Administration \u2014 integration notes<\/h1>\n<p>Documentation for the upstream system that feeds the <code>raw<\/code>, <code>silver<\/code> and <code>gold<\/code> schemas. This stands in for whatever real system documentation you would drop here: a vendor&#x27;s API reference, an internal wiki export, a data contract.<\/p>\n<h2>Customer registry<\/h2>\n<p>The customer registry is the system of record for policyholders. One row per person, keyed by <code>id_cliente<\/code>, which is stable for the lifetime of the customer relationship and is reused across policy and claim records as a foreign key.<\/p>\n<p><code>nome<\/code> holds the full legal name as it appears on the policy document. <code>cpf<\/code> is the Brazilian individual taxpayer registration number, stored formatted with dots and a dash. It is the natural key for regulatory reporting and is treated as restricted under LGPD. <code>email<\/code> and <code>telefone<\/code> are contact channels; <code>telefone<\/code> is a mobile number stored as digits only, with country and area code, no separators. <code>data_nascimento<\/code> is used for age-banded pricing and is required for underwriting. <code>cidade<\/code> and <code>estado<\/code> describe the residence used for regional risk rating. <code>data_cadastro<\/code> is the date the customer record was opened, not the date of their first policy.<\/p>\n<p><code>apelido<\/code> was introduced in 2019 for a customer-portal greeting feature that was cancelled before launch. The column was never populated and no process writes to it. It is retained only because removing it requires a coordinated release with three downstream consumers.<\/p>\n<h2>Policy records<\/h2>\n<p>One row per policy, keyed by <code>id_apolice<\/code>, linked to a customer by <code>id_cliente<\/code>.<\/p>\n<p><code>tipo_seguro<\/code> takes one of four values: <code>auto<\/code>, <code>residencial<\/code>, <code>vida<\/code>, <code>viagem<\/code>. <code>valor_premio<\/code> is the annualised premium in Brazilian reais, not the monthly instalment. Reporting that divides it by twelve is a recurring source of error. <code>valor_cobertura<\/code> is the maximum payout under the policy, also in reais. <code>data_inicio<\/code> and <code>data_fim<\/code> bound the coverage period; policies are written for 365 days and renewed as new rows rather than by extending an existing row. <code>status<\/code> is one of <code>ativa<\/code>, <code>cancelada<\/code> or <code>vencida<\/code>. A policy past <code>data_fim<\/code> that was not renewed becomes <code>vencida<\/code>; <code>cancelada<\/code> means terminated before term, which triggers a pro-rata refund calculation.<\/p>\n<p><code>pais<\/code> is a legacy field from a planned international expansion that was never launched. Every row carries the literal value <code>Brasil<\/code>. It is not a meaningful dimension and should not be used as a grouping key.<\/p>\n<h2>Claim records<\/h2>\n<p>One row per claim, keyed by <code>id_sinistro<\/code>, linked to a policy by <code>id_apolice<\/code>.<\/p>\n<p><code>data_ocorrencia<\/code> is the date of the insured event, not the date the claim was filed. The gap between the two is not currently captured. <code>tipo_sinistro<\/code> classifies the event: <code>colisao<\/code>, <code>roubo<\/code>, <code>incendio<\/code>, <code>furto<\/code> or <code>danos_terceiros<\/code>. <code>valor_sinistro<\/code> is the amount claimed, in reais. It is exported as text rather than a decimal because the extract was originally built against a system that returned all monetary values as strings. Consumers are expected to cast it. The fix is tracked but has never been prioritised. <code>status_sinistro<\/code> follows the claims workflow: <code>aberto<\/code>, <code>em_analise<\/code>, then one of <code>aprovado<\/code>, <code>negado<\/code> or <code>pago<\/code>. <code>descricao<\/code> is free text entered by the claims handler and is not validated.<\/p>\n<h2>Derived layers<\/h2>\n<p>The <code>silver<\/code> layer holds the curated policy view, filtered to active policies only, which is why its <code>status<\/code> column carries a single value.<\/p>\n<p>The <code>gold<\/code> layer holds the monthly claims rollup. <code>taxa_sinistralidade<\/code> and related rate measures are claims value over premium value for the period, expressed as a ratio and not a percentage.<\/p>"}, {"id": "tpch_spec", "title": "TPC-H \u2014 excerpts from the standard specification", "html": "<h1>TPC-H \u2014 excerpts from the standard specification<\/h1>\n<blockquote>Excerpts from the TPC Benchmark(TM) H Standard Specification, Revision 3.0.1,<\/blockquote>\n<blockquote>published by the Transaction Processing Performance Council at<\/blockquote>\n<blockquote><a href=\"https://www.tpc.org/tpc_documents_current_versions/pdf/tpc-h_v3.0.1.pdf\" target=\"_blank\" rel=\"noopener\">https://www.tpc.org/tpc_documents_current_versions/pdf/tpc-h_v3.0.1.pdf<\/a><\/blockquote>\n<blockquote><\/blockquote>\n<blockquote>This file exists to test the grounding mechanism against documentation that was<\/blockquote>\n<blockquote>not written for this project. The tables it describes (<code>samples.tpch<\/code>) ship with<\/blockquote>\n<blockquote>Databricks and were not created here either. Neither side of the test was authored<\/blockquote>\n<blockquote>by whoever is running it, which is the whole point: a test where you write both the<\/blockquote>\n<blockquote>question and the answer cannot fail, and a test that cannot fail proves nothing.<\/blockquote>\n<h2>Coded column values<\/h2>\n<p>The single-character columns are the reason this test is worth running. Their values are <code>N<\/code>, <code>A<\/code>, <code>R<\/code>, <code>O<\/code>, <code>F<\/code>, <code>P<\/code>. Nothing in the data says what they mean.<\/p>\n<p><strong>L_RETURNFLAG<\/strong> is set to a value selected as follows: if L_RECEIPTDATE is on or before CURRENTDATE then either &quot;R&quot; or &quot;A&quot; is selected at random, else &quot;N&quot; is selected.<\/p>\n<p><strong>L_LINESTATUS<\/strong> is set to &quot;O&quot; if L_SHIPDATE is after CURRENTDATE, and &quot;F&quot; otherwise.<\/p>\n<p><strong>O_ORDERSTATUS<\/strong> is set to &quot;F&quot; if all lineitems of this order have L_LINESTATUS set to &quot;F&quot;; to &quot;O&quot; if all lineitems of this order have L_LINESTATUS set to &quot;O&quot;; and to &quot;P&quot; otherwise.<\/p>\n<p><strong>O_SHIPPRIORITY<\/strong> is set to 0 for every row.<\/p>\n<h2>Table layouts<\/h2>\n<p>CUSTOMER carries C_CUSTKEY as primary key, with C_NATIONKEY a foreign key to N_NATIONKEY, and C_MKTSEGMENT as fixed text of size 10 drawn from the Segments list.<\/p>\n<p>ORDERS carries O_ORDERKEY as primary key and O_CUSTKEY as a foreign key to C_CUSTKEY. O_TOTALPRICE is computed as the sum of L_EXTENDEDPRICE <em> (1 + L_TAX) <\/em> (1 - L_DISCOUNT) over all lineitems of the order, so it already includes tax and discount and must not have them applied again. O_ORDERPRIORITY is a random string from the Priorities list. O_CLERK is text appended with at least nine digits with leading zeros, in the form &quot;Clerk#&quot; followed by a value.<\/p>\n<p>Orders are not present for all customers. O_CUSTKEY is generated such that O_CUSTKEY modulo 3 is not zero, so every third customer in C_CUSTKEY order is not assigned any order. One third of customers have no order in the database. This is deliberate, to exercise handling of &quot;dead data&quot; when joining tables.<\/p>\n<p>LINEITEM has the compound primary key L_ORDERKEY, L_LINENUMBER. L_ORDERKEY is a foreign key to O_ORDERKEY. L_PARTKEY and L_SUPPKEY together form a compound foreign key to PS_PARTKEY and PS_SUPPKEY. Each order has a random number of lineitems within 1 to 7.<\/p>\n<p>L_EXTENDEDPRICE is L_QUANTITY multiplied by the P_RETAILPRICE of the part identified by L_PARTKEY. It is therefore a gross line amount before discount and tax; L_DISCOUNT is a rate between 0.00 and 0.10 and L_TAX a rate between 0.00 and 0.08, both expressed as fractions rather than percentages.<\/p>\n<p>L_SHIPDATE is O_ORDERDATE plus a random value of 1 to 121 days. L_COMMITDATE is O_ORDERDATE plus 30 to 90 days. L_RECEIPTDATE is L_SHIPDATE plus 1 to 30 days. The three dates are distinct events: promised, dispatched and received.<\/p>\n<h2>Reference tables<\/h2>\n<p>NATION holds exactly 25 rows, with N_NATIONKEY a unique value between 0 and 24 and N_REGIONKEY a foreign key to R_REGIONKEY. The series is fixed: (0, ALGERIA, 0), (1, ARGENTINA, 1), (2, BRAZIL, 1), (3, CANADA, 1), (4, EGYPT, 4), (5, ETHIOPIA, 0), (6, FRANCE, 3), (7, GERMANY, 3), (8, INDIA, 2), (9, INDONESIA, 2), (10, IRAN, 4), (11, IRAQ, 4), (12, JAPAN, 2), (13, JORDAN, 4), (14, KENYA, 0), (15, MOROCCO, 0), (16, MOZAMBIQUE, 0), (17, PERU, 1), (18, CHINA, 2), (19, ROMANIA, 3), (20, SAUDI ARABIA, 4), (21, VIETNAM, 2), (22, RUSSIA, 3), (23, UNITED KINGDOM, 3), (24, UNITED STATES, 1).<\/p>\n<p>REGION holds exactly 5 rows: (0, AFRICA), (1, AMERICA), (2, ASIA), (3, EUROPE), (4, MIDDLE EAST).<\/p>\n<h2>Parts and suppliers<\/h2>\n<p>PART carries P_PARTKEY as primary key. P_NAME is generated by concatenating five unique randomly selected colour and texture words separated by single spaces, so it is a synthetic label and not a product description. P_MFGR is &quot;Manufacturer#&quot; followed by a digit from 1 to 5. P_BRAND is &quot;Brand#&quot; followed by two digits derived from the manufacturer. P_RETAILPRICE is computed from P_PARTKEY by formula, not drawn at random, so it is not an independent economic quantity.<\/p>\n<p>PARTSUPP holds four rows for each row in PART, one per supplier. PS_AVAILQTY is a random value from 1 to 9,999 and PS_SUPPLYCOST a random value from 1.00 to 1,000.00.<\/p>\n<p>The comment columns across every table (C_COMMENT, O_COMMENT, L_COMMENT, and the rest) hold generated filler text of a specified length range. They carry no meaning and exist to give the rows realistic width.<\/p>"}]</script>
<script>
const DATA = JSON.parse(document.getElementById('payload').textContent);
const DOCS = JSON.parse(document.getElementById('docs').textContent);
const nav = document.getElementById('nav'), content = document.getElementById('content');
let current = {view: 'overview'}, filter = '';

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bytes = n => {
  if (!n) return '-';
  const u = ['B','KB','MB','GB','TB']; let i = 0, v = n;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return v.toFixed(1) + ' ' + u[i];
};

function matches(t) {
  if (!filter) return true;
  const f = filter.toLowerCase();
  return t.key.toLowerCase().includes(f) || t.columns.some(c => c.name.toLowerCase().includes(f));
}

function renderNav() {
  const schemas = {};
  DATA.tables.filter(matches).forEach(t => (schemas[t.schema] ??= []).push(t));
  let html = `<div class="group"><button class="item ${current.view === 'overview' ? 'active' : ''}"
      data-view="overview"><span class="hash">≡</span> Overview</button></div>`;
  for (const [schema, tables] of Object.entries(schemas)) {
    html += `<div class="group"><div class="group-label">${esc(schema)}</div>`;
    tables.forEach(t => {
      const active = current.view === 'table' && current.key === t.key;
      html += `<button class="item ${active ? 'active' : ''}" data-view="table" data-key="${esc(t.key)}">
        <span class="hash">#</span>${esc(t.name)}<span class="flags">
        ${t.piiCount ? '<span class="dot pii" title="personal data"></span>' : ''}
        ${t.orphan ? '<span class="dot orphan" title="never read"></span>' : ''}</span></button>`;
    });
    html += '</div>';
  }
  if (DOCS.length) {
    html += '<div class="group"><div class="group-label">Source documentation</div>';
    DOCS.forEach(d => {
      const active = current.view === 'doc' && current.key === d.id;
      html += `<button class="item ${active ? 'active' : ''}" data-view="doc" data-key="${esc(d.id)}">
        <span class="hash">§</span>${esc(d.id)}</button>`;
    });
    html += '</div>';
  }
  nav.innerHTML = html;
}

function renderOverview() {
  const s = DATA.stats, r = DATA.run;
  const pct = s.columns ? Math.round(100 * s.documented / s.columns) : 0;
  content.innerHTML = `
    <div class="crumb">${esc(DATA.catalog)}</div>
    <h2>Catalog documentation</h2>
    <div class="meta"><span>${s.tables} tables</span><span>${s.columns} columns</span>
      <span>generated ${esc(DATA.generatedAt)}</span></div>
    <div class="cards">
      <div class="card good"><div class="n">${pct}%</div><div class="l">columns documented</div></div>
      <div class="card pii"><div class="n">${s.piiColumns}</div><div class="l">personal-data columns</div></div>
      <div class="card warn"><div class="n">${s.orphans}</div><div class="l">never read</div></div>
      <div class="card warn"><div class="n">${s.dead}</div><div class="l">dead columns</div></div>
      <div class="card warn"><div class="n">${s.fragmented}</div><div class="l">fragmented tables</div></div>
    </div>
    ${r ? `<div class="desc">Every description on this site was generated by
      <code>${esc(r.model)}</code> and written back to Unity Catalog:
      <strong>${r.comments} comments</strong> across ${r.tables} tables in ${r.seconds}s,
      using ${(r.promptTokens + r.completionTokens).toLocaleString()} tokens
      — <strong>$${r.cost.toFixed(4)}</strong> at list price.
      That figure is modelled, not billed: the run was made on a free tier that charges nothing.</div>` : ''}
    <p style="color:var(--muted)">Descriptions are grounded in the documentation of the system each table
    came from. Open any table to see which passages produced its descriptions, and follow them into the
    source documents in the sidebar.</p>
    <div class="note">A dot beside a table marks personal data
      (<span class="dot pii"></span>) or a table nothing has read (<span class="dot orphan"></span>).
      This is a snapshot of scan ${esc(DATA.scanId)}, not a live view.</div>`;
}

function renderTable(key) {
  const t = DATA.tables.find(x => x.key === key);
  if (!t) return renderOverview();
  const rows = t.columns.map(c => {
    const flags = [
      ...(c.piiLabels || []).map(l => `<span class="badge pii">${esc(l)}</span>`),
      c.allNull ? '<span class="badge dead">100% null</span>' : '',
      c.constant ? '<span class="badge dead">single value</span>' : '',
    ].join('');
    const nulls = c.nullRatio !== null ? `${Math.round(c.nullRatio * 100)}% null` : '';
    return `<tr>
      <td class="cname">${esc(c.name)}</td>
      <td class="ctype">${esc(c.type)}</td>
      <td class="ccomment ${c.comment ? '' : 'missing'}">${esc(c.comment || 'not documented')}${flags ? '<div>' + flags + '</div>' : ''}</td>
      <td class="stat">${esc(nulls)}<br>${c.distinct !== null ? esc(c.distinct) + ' distinct' : ''}</td>
    </tr>`;
  }).join('');

  const p = t.provenance;
  content.innerHTML = `
    <div class="crumb">${esc(DATA.catalog)} / ${esc(t.schema)}</div>
    <h2>${esc(t.name)}</h2>
    <div class="meta">
      <span class="badge type">${esc(t.type)}</span>
      <span>${(t.rows ?? 0).toLocaleString()} rows</span>
      <span>${t.columns.length} columns</span>
      <span>${bytes(t.sizeBytes)}${t.numFiles ? ' in ' + t.numFiles + ' files' : ''}</span>
      ${t.orphan ? '<span style="color:var(--warn)">never read</span>'
                 : (t.lastRead ? '<span>last read ' + esc(t.lastRead.slice(0, 10)) + '</span>' : '')}
      ${t.fragmented ? '<span style="color:var(--warn)">fragmented</span>' : ''}
    </div>
    ${t.comment ? `<div class="desc">${esc(t.comment)}</div>` : ''}
    ${p ? `<div class="prov">Grounded in <strong>${esc(p.system)}</strong>:
        ${p.passages.map(x => `<span class="passage" data-doc="${esc(p.system)}">${esc(x.split(':').slice(1).join(':').trim() || x)}</span>`).join('')}
      </div>` : '<div class="prov" style="color:var(--faint)">No source documentation mapped to this table.</div>'}
    <table class="cols">
      <thead><tr><th>Column</th><th>Type</th><th>Description</th><th>Profile</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function renderDoc(id) {
  const d = DOCS.find(x => x.id === id);
  if (!d) return renderOverview();
  content.innerHTML = `<div class="crumb">source documentation</div><div class="doc">${d.html}</div>`;
}

function render() {
  renderNav();
  if (current.view === 'table') renderTable(current.key);
  else if (current.view === 'doc') renderDoc(current.key);
  else renderOverview();
  document.getElementById('main').scrollTop = 0;
}

nav.addEventListener('click', e => {
  const b = e.target.closest('.item');
  if (!b) return;
  current = {view: b.dataset.view, key: b.dataset.key};
  render();
});
content.addEventListener('click', e => {
  const p = e.target.closest('.passage');
  if (!p) return;
  current = {view: 'doc', key: p.dataset.doc};
  render();
});
document.getElementById('q').addEventListener('input', e => { filter = e.target.value; renderNav(); });
render();
</script>
</body>
</html>
